# Gera o instalador do Windows e publica no GitHub Releases quando uma tag v* é enviada.
#   git tag v1.0.1 && git push origin v1.0.1
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      # sobe os 2 arquivos que o auto-update precisa (instalador e latest.yml) e confere
      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # sem o .blockmap: força as versões antigas a baixarem o arquivo inteiro (não trava)
          FILES="release/Especial-Cacamba-dos-Cria-Setup.exe release/latest.yml"
          ls -la $FILES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" $FILES --title "Especial Caçamba dos Cria ${TAG}" --notes "Atualização automática: quem já tem o app recebe sozinho." --latest
          fi
          N=$(gh release view "$TAG" --json assets -q '.assets | length')
          echo "arquivos na release: $N"
          test "$N" -ge 2
